    height: 100%;

/* ================================
   GOLDEN AMBIENT LIGHT
================================ */

.glow {

    position: absolute;

    width: 90vw;
    height: 70vh;

    top: 5%;

    background:
        radial-gradient(
            ellipse,
            rgba(218,165,84,0.18),
            transparent 65%

    filter: blur(40px);

    pointer-events: none;

    animation: glowMove 7s ease-in-out infinite;
}


@keyframes glowMove {

    0%,100% {
        transform: scale(1);
        opacity: .55;
    }

    50% {
        transform: scale(1.12);
        opacity: .85;
    }
}


/* ================================
   FLOATING GOLD PARTICLES
================================ */

.particles {

    position: absolute;

    inset: 0;

    pointer-events: none;

            circle,
            rgba(255,220,153,.75) 0 1px,

        ),

        radial-gradient(
            circle,
            rgba(255,232,185,.55) 0 1px,
            transparent 2px

    background-size:
        190px 220px,
        270px 310px;

    background-position:
        20px 30px,
        90px 120px;

    animation: particlesMove 15s linear infinite;

    opacity: .55;
}


@keyframes particlesMove {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-20px);
    }

    100% {
        transform: translateY(0);
    }
}
